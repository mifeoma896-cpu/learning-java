<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html table</title>
</head>
<body>
    <h1>hello world</h1>
    <p>creating my first html table</p>
<!--call my first element table-->
<table style="width:100;">
    <!--table head-->
    <thead>
        <tr>
        <th>Reg number</th>
        <th>Surname</th>
        <th>First name</th>
        <th>Last name</th>
        </tr>
    </thead>
    <!--table body-->
    <tbody>
        <tr>
            <td style="text-align: center;">202644875768</td>
            <td style="text-align: center;">Jackson</td>
            <td style="text-align: center;">Micheal</td>
            <td style="text-align: center;">Tochuchukwu</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td style="text-align: center;">total</td>
             <td style="text-align: center;">2 students</td>
        </tr>
    </tfoot>


</table>
</body>
</html>
